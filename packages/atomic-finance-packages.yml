notes: >-
  Atomic.Finance ships no REST API; its public developer surface is a set of
  open-source Bitcoin / Discreet Log Contract (DLC) libraries published to npm
  under two first-party scopes: @atomicfinance/* (the Bitcoin Abstraction Layer
  SDK, monorepo bitcoin-abstraction-layer) and @node-dlc/* (the DLC protocol
  monorepo node-dlc). All at latest as of the probe date; the company itself is
  reported out of business but the packages remain published.
