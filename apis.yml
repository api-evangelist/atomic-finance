aid: atomic-finance
name: Atomic Finance
description: >-
  Atomic.Finance was a non-custodial, Bitcoin-native financial platform based in
  Toronto, Canada (founded 2018) that built options-trading and hedging products
  directly on Bitcoin using Discreet Log Contracts (DLCs) — with no custody, no
  wrapping, and no swapping. Rather than a hosted REST API, the company's public
  developer surface is a body of open-source Bitcoin and DLC tooling published to
  GitHub (the atomicfinance organization, 34 repositories) and to npm under two
  first-party scopes: @atomicfinance/* (the Bitcoin Abstraction Layer SDK) and
  @node-dlc/* (a Node.js implementation of the DLC and Lightning wire protocols).
  The company is reported out of business, but the libraries remain published and
  implement DLC, BIP-340 Schnorr/adaptor signatures, and BOLT Lightning standards.
